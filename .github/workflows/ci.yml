# Every push to main, every pull request (on any base: the PRs are stacked) and a manual run. Each part
# of the check is its own job, named by its tool so they group on a PR: eslint, ruff:lint, shellcheck and
# actionlint; tsc; test:page, test:sidecar and test:layout:<id> for each bundled layout (test:layout lists
# them); build; pr:title. The ruleset requires only `ci ok`, which fails when any job failed or was
# cancelled.
#
# Actions are pinned to commits (Dependabot proposes bumps); the version is in the comment. Python is
# 3.12, the Frame's; the Python tools' versions come from requirements-dev.txt.
name: ci
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited] # edited: a retitled PR runs pr:title again
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  eslint:
    name: eslint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tools/eslint/package-lock.json
      - run: npm ci && npm ci --prefix tools/eslint # the project's packages give ESLint their types
      - run: npm run lint:eslint

  ruff-lint:
    name: ruff:lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.12", cache: pip, cache-dependency-path: requirements-dev.txt }
      - run: python -m venv .venv && .venv/bin/pip install -c requirements-dev.txt ruff
      - run: npm run lint:ruff

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.12", cache: pip, cache-dependency-path: requirements-dev.txt }
      - run: python -m venv .venv && .venv/bin/pip install -c requirements-dev.txt shellcheck-py
      - run: npm run lint:shellcheck

  actionlint:
    name: actionlint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.12", cache: pip, cache-dependency-path: requirements-dev.txt }
      - run: python -m venv .venv && .venv/bin/pip install -c requirements-dev.txt actionlint-py
      - run: npm run lint:actionlint

  tsc:
    name: tsc
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run typecheck

  test-page:
    name: test:page
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24, cache: npm }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.12" } # tests/boot.ts loads the packs through the sidecar (stdlib only)
      - run: npm ci
      - run: npm test

  test-sidecar:
    name: test:sidecar
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.12", cache: pip, cache-dependency-path: requirements-dev.txt }
      - run: python -m venv .venv && .venv/bin/pip install -r requirements-dev.txt
      - run: npm run test:py

  # The bundled layouts as the sidecar's loader resolves them, for the job per layout below: a new
  # layout gets its own check without a change here.
  test-layout:
    name: test:layout
    runs-on: ubuntu-24.04
    outputs:
      ids: ${{ steps.list.outputs.ids }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.12" }
      - id: list
        env:
          PYTHONPATH: sidecar
        run: |
          python3 -m polykey.packs packs schema/pack.schema.json > "$RUNNER_TEMP/boot.json"
          ids=$(python3 -c 'import json, sys; print(json.dumps(sorted(json.load(sys.stdin)["catalog"]["layouts"])))' < "$RUNNER_TEMP/boot.json")
          echo "layouts: $ids"
          echo "ids=$ids" >> "$GITHUB_OUTPUT"

  test-layout-id:
    name: "test:layout:${{ matrix.layout }}"
    needs: test-layout
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false # each layout reports on its own
      matrix:
        layout: ${{ fromJSON(needs.test-layout.outputs.ids) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24, cache: npm }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.12", cache: pip, cache-dependency-path: requirements-dev.txt }
      - run: python -m venv .venv && .venv/bin/pip install -r requirements-dev.txt
      - run: npm ci
      - env:
          LAYOUT: ${{ matrix.layout }}
        run: npm run test:layout -- "$LAYOUT"

  build:
    name: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run build
      - name: bundle size
        run: |
          raw=$(stat -c %s dist/stage/bundle.js)
          gz=$(gzip -9c dist/stage/bundle.js | wc -c)
          kib() { awk -v bytes="$1" 'BEGIN { printf "%.1f", bytes / 1024 }'; }
          {
            echo "### bundle.js"
            echo
            echo "| | bytes | KiB |"
            echo "|---|---:|---:|"
            echo "| raw | $raw | $(kib "$raw") |"
            echo "| gzipped | $gz | $(kib "$gz") |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "bundle.js: $raw bytes, $gz gzipped"

  pr-title:
    name: pr:title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          # Squash-merged: the title becomes the commit on main, so it is a conventional commit.
          pattern='^(feat|fix|perf|refactor|docs|test|build|ci|chore|style|revert)(\([a-z0-9-]+\))?!?: .+'
          if [[ ! $TITLE =~ $pattern ]]; then
            echo "::error::The PR title is not a conventional commit, type(scope): summary"
            exit 1
          fi
          echo "PR title ok"

  ci-ok:
    name: ci ok # the name the ruleset requires
    needs: [eslint, ruff-lint, shellcheck, actionlint, tsc, test-page, test-sidecar, test-layout, test-layout-id, build, pr-title]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          # Skipped is fine (pr:title, off pull requests); failed or cancelled is not.
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS"
          jq -e 'all(.[]; .result == "success" or .result == "skipped")' <<< "$NEEDS" > /dev/null
