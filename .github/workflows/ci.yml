# Every push to main, every pull request (on any base: the PRs are stacked) and a manual run. Each part
# of the check is its own job, named by its tool so they group on a PR: eslint, ruff:lint, ruff:format,
# shellcheck and actionlint; tsc; test:page, test:sidecar and test:layout:<id> for each bundled layout
# (test:layout lists them); build; test:installer; pr:title. The ruleset requires only `ci ok`, which
# fails when any job failed or was cancelled.
#
# On a push to main, once `ci ok` passes: release (release-please keeps the release PR up to date, and
# when one is merged, tags vX.Y.Z and drafts its GitHub release), then release:assets (builds the tag
# and attaches its files to the draft). CI stops at the draft; signing and publishing are a TODO at
# the end of this file (docs/RELEASING.md).
#
# Actions are pinned to commits (Dependabot proposes bumps); the version is in the comment. Python is
# 3.12, the Frame's; the Python tools' versions come from requirements-dev.txt.
name: ci
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited] # edited: a retitled PR runs pr:title again
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  eslint:
    name: eslint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tools/eslint/package-lock.json
      - run: npm ci && npm ci --prefix tools/eslint # the project's packages give ESLint their types
      - run: npm run lint:eslint

  ruff-lint:
    name: ruff:lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.12", cache: pip, cache-dependency-path: requirements-dev.txt }
      - run: python -m venv .venv && .venv/bin/pip install -c requirements-dev.txt ruff
      - run: npm run lint:ruff

  ruff-format:
    name: ruff:format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.12", cache: pip, cache-dependency-path: requirements-dev.txt }
      - run: python -m venv .venv && .venv/bin/pip install -c requirements-dev.txt ruff
      - run: npm run lint:ruff-format

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.12", cache: pip, cache-dependency-path: requirements-dev.txt }
      - run: python -m venv .venv && .venv/bin/pip install -c requirements-dev.txt shellcheck-py
      - run: npm run lint:shellcheck

  actionlint:
    name: actionlint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.12", cache: pip, cache-dependency-path: requirements-dev.txt }
      - run: python -m venv .venv && .venv/bin/pip install -c requirements-dev.txt actionlint-py
      - run: npm run lint:actionlint

  tsc:
    name: tsc
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run typecheck

  test-page:
    name: test:page
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24, cache: npm }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.12" } # tests/boot.ts loads the packs through the sidecar (stdlib only)
      - run: npm ci
      - run: npm test

  test-sidecar:
    name: test:sidecar
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.12", cache: pip, cache-dependency-path: requirements-dev.txt }
      - run: python -m venv .venv && .venv/bin/pip install -r requirements-dev.txt
      - run: npm run test:py

  # The bundled layouts as the sidecar's loader resolves them, for the job per layout below: a new
  # layout gets its own check without a change here.
  test-layout:
    name: test:layout
    runs-on: ubuntu-24.04
    outputs:
      ids: ${{ steps.list.outputs.ids }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.12" }
      - id: list
        env:
          PYTHONPATH: sidecar
        run: |
          python3 -m polykey.packs packs schema/pack.schema.json > "$RUNNER_TEMP/boot.json"
          ids=$(python3 -c 'import json, sys; print(json.dumps(sorted(json.load(sys.stdin)["catalog"]["layouts"])))' < "$RUNNER_TEMP/boot.json")
          echo "layouts: $ids"
          echo "ids=$ids" >> "$GITHUB_OUTPUT"

  test-layout-id:
    name: "test:layout:${{ matrix.layout }}"
    needs: test-layout
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false # each layout reports on its own
      matrix:
        layout: ${{ fromJSON(needs.test-layout.outputs.ids) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24, cache: npm }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.12", cache: pip, cache-dependency-path: requirements-dev.txt }
      - run: python -m venv .venv && .venv/bin/pip install -r requirements-dev.txt
      - run: npm ci
      - env:
          LAYOUT: ${{ matrix.layout }}
        run: npm run test:layout -- "$LAYOUT"

  build:
    name: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run build
      - name: bundle size
        run: |
          raw=$(stat -c %s dist/stage/bundle.js)
          gz=$(gzip -9c dist/stage/bundle.js | wc -c)
          kib() { awk -v bytes="$1" 'BEGIN { printf "%.1f", bytes / 1024 }'; }
          {
            echo "### bundle.js"
            echo
            echo "| | bytes | KiB |"
            echo "|---|---:|---:|"
            echo "| raw | $raw | $(kib "$raw") |"
            echo "| gzipped | $gz | $(kib "$gz") |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "bundle.js: $raw bytes, $gz gzipped"

  # The installer's life in a throwaway home: releases built with release.sh, signed with a throwaway
  # key and served from localhost (the venv's python3 has aiohttp, as SteamOS does).
  test-installer:
    name: test:installer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24, cache: npm }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.12", cache: pip, cache-dependency-path: requirements-dev.txt }
      - run: python -m venv .venv && .venv/bin/pip install -r requirements-dev.txt
      - run: npm ci
      - run: npm run test:install

  pr-title:
    name: pr:title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          # Squash-merged: the title becomes the commit on main, so it is a conventional commit.
          pattern='^(feat|fix|perf|refactor|docs|test|build|ci|chore|style|revert)(\([a-z0-9-]+\))?!?: .+'
          if [[ ! $TITLE =~ $pattern ]]; then
            echo "::error::The PR title is not a conventional commit, type(scope): summary"
            exit 1
          fi
          echo "PR title ok"

  ci-ok:
    name: ci ok # the name the ruleset requires
    needs: [eslint, ruff-lint, ruff-format, shellcheck, actionlint, tsc, test-page, test-sidecar, test-layout, test-layout-id, build, test-installer, pr-title]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          # Skipped is fine (pr:title, off pull requests); failed or cancelled is not.
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS"
          jq -e 'all(.[]; .result == "success" or .result == "skipped")' <<< "$NEEDS" > /dev/null

  # release-please (release-please-config.json) acts with RELEASE_PLEASE_TOKEN, a fine-grained token
  # (this repo; contents and pull requests read/write), so CI runs on the release PR: what the Actions
  # token does starts no workflow. Only release-please runs in this job, so the token never meets the
  # build's packages.
  release:
    name: release
    needs: ci-ok # after every check, so a red main never releases
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions: {} # release-please uses its own token
    outputs:
      created: ${{ steps.release-please.outputs.release_created }}
      tag: ${{ steps.release-please.outputs.tag_name }}
      version: ${{ steps.release-please.outputs.version }}
    steps:
      - id: release-please
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

  # The new draft's files: its tag built by scripts/release.sh, which makes the same files from the
  # same commit. Re-running this job replaces files already attached.
  release-assets:
    name: release:assets
    needs: release
    if: needs.release.outputs.created == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write # attach files to the draft; this job never signs or publishes it
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag }}
          persist-credentials: false
      - name: release key
        id: key
        run: |
          if grep -q '^polykey-release .*ssh-ed25519 ' contrib/allowed_signers; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No release key in contrib/allowed_signers at this tag (scripts/sign-release.sh --init), so nothing is built"
          fi
      - if: steps.key.outputs.present == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24, cache: npm }
      # No package's install scripts run in a job that can write the repo (the build needs none).
      - if: steps.key.outputs.present == 'true'
        run: npm ci --ignore-scripts
      - if: steps.key.outputs.present == 'true'
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: scripts/release.sh "$VERSION"
      - if: steps.key.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          cd dist/release
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            "polykey-$VERSION.tar.gz" install.sh latest.json SHA256SUMS

  # TODO(signing): not settled yet. Either releases are signed and published on your PC
  # (scripts/sign-release.sh vX.Y.Z, as now) and nothing more goes here, or a job here signs and
  # publishes the draft after an approval in GitHub. Until then CI stops at the draft.
