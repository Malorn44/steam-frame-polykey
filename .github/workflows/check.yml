name: check
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }  # the Frame's Python
      - run: python -m venv .venv && .venv/bin/pip install -r requirements-dev.txt
      - run: npm ci
      - run: npm run check
