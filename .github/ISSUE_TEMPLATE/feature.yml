name: Feature request
description: An idea for something polykey could do.
labels: [suggestion]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you're trying to do, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you'd like
      description: How it would work, from your side.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of polykey it's about.
      options:
        - "Packs: keyboards and layouts, emoji, themes, languages"
        - "Input: typing, Japanese or Korean input, suggestions, swipe, dictation"
        - "Setup: settings, install, updates"
        - Other
    validations:
      required: true
  - type: checkboxes
    id: pack
    attributes:
      label: Could it be a pack?
      description: New layouts, keyboards and themes can be your own JSON packs, with no change to polykey ([docs/PACKS.md](https://github.com/Malorn44/steam-frame-polykey/blob/main/docs/PACKS.md)).
      options:
        - label: I've checked, and this needs a change to polykey itself.
