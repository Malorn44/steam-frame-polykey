# Monthly version updates, one grouped PR per ecosystem and folder. The PR title is the commit on main
# (squash merge), so it is a conventional commit: chore(deps): ….
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    commit-message: { prefix: chore(deps) }
    groups:
      actions: { patterns: ["*"] }

  - package-ecosystem: npm
    directory: /
    schedule: { interval: monthly }
    commit-message: { prefix: chore(deps) }
    groups:
      npm: { patterns: ["*"] }

  - package-ecosystem: npm
    directory: /tools/eslint
    schedule: { interval: monthly }
    commit-message: { prefix: chore(deps) }
    groups:
      eslint: { patterns: ["*"] }
    ignore:
      # typescript-eslint supports TypeScript up to 6.0 (tools/eslint/package.json).
      - dependency-name: typescript
        versions: [">=6.1"]

  - package-ecosystem: pip
    directory: /
    schedule: { interval: monthly }
    commit-message: { prefix: chore(deps) }
    groups:
      pip: { patterns: ["*"] }
    ignore:
      # Pinned to the version SteamOS ships; the sidecar runs on the Frame's system Python.
      - dependency-name: aiohttp
